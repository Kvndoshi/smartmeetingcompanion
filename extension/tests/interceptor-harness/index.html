<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Interceptor harness</title>
<!--
  Browser tests for src/content/meet-interceptor.ts (the Meet mic swap).
  1. npm run build && node tests/interceptor-harness/prepare.mjs
  2. Serve this folder on 127.0.0.1 (e.g. python -m http.server 5181 --bind 127.0.0.1)
  3. Open it in Chrome, click "Run interceptor tests"; every line should say PASS (takes about a minute).

  The page plays the part of Google Meet: it owns the peer connection and toggles
  the mic the ways a call UI can (replaceTrack(null) / replaceTrack(track),
  track.enabled through its own reference or through sender.track, track.stop()
  plus a fresh getUserMedia-style track). What the call really carries is
  measured on the far end of a loopback connection (fake mic = 440 Hz tone,
  fake translation = 660 Hz tone).
-->
<script>
  // What the sender really carries. The interceptor shows Meet its own track on
  // `sender.track`, so the tests read the native getter, captured before it loads.
  window.__nativeSenderTrack = Object.getOwnPropertyDescriptor(RTCRtpSender.prototype, "track").get;
  window.__NativeAudioContext = window.AudioContext;
  window.__nativeAddModule = AudioWorklet.prototype.addModule;
</script>
<!-- Loaded first, like the MAIN-world content script at document_start -->
<script src="interceptor.js"></script>
</head>
<body>
<button id="run" style="font-size:20px;padding:12px">Run interceptor tests</button>
<pre id="out"></pre>
<script>
const out = document.getElementById("out");
const results = [];
function log(name, pass, detail) {
  results.push({ name, pass: !!pass, detail });
  out.textContent += `${pass ? "PASS" : "FAIL"}  ${name}  ${detail ?? ""}\n`;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const carried = (sender) => window.__nativeSenderTrack.call(sender);
function post(type, extra) { window.postMessage({ source: "interpreter-ext", type, ...extra }, "*"); }
function nextActivation(timeoutMs = 4000) {
  return new Promise((resolve) => {
    const t = setTimeout(() => { window.removeEventListener("message", h); resolve(null); }, timeoutMs);
    function h(e) {
      if (e.data && e.data.source === "interpreter-ext" && e.data.type === "interpreter-activation-result") {
        clearTimeout(t); window.removeEventListener("message", h); resolve(e.data);
      }
    }
    window.addEventListener("message", h);
  });
}
async function activate(timeoutMs) { const p = nextActivation(timeoutMs); post("interpreter-activate"); return p; }
async function deactivate() { post("interpreter-deactivate"); await sleep(400); }
function countPcm(ms) {
  return new Promise((resolve) => {
    let n = 0, bytes = 0, loud = 0;
    const h = (e) => {
      if (!e.data || e.data.type !== "interpreter-mic-pcm") return;
      n++; bytes += e.data.data.byteLength;
      for (const v of new Int16Array(e.data.data)) if (Math.abs(v) > 50) { loud++; break; }
    };
    window.addEventListener("message", h);
    setTimeout(() => { window.removeEventListener("message", h); resolve({ n, bytes, loud }); }, ms);
  });
}
function wav16k(seconds, freq) {
  const rate = 16000, n = Math.floor(rate * seconds), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  // 20 ms fades: an abrupt start/stop is a click that smears across every frequency bin.
  const fade = (i) => Math.min(1, i / 320, (n - 1 - i) / 320);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.round(Math.sin((2 * Math.PI * freq * i) / rate) * 12000 * fade(i)), true);
  return Array.from(new Uint8Array(buf));
}
async function connect(pc1, pc2) {
  pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate);
  pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate);
  const offer = await pc1.createOffer(); await pc1.setLocalDescription(offer); await pc2.setRemoteDescription(offer);
  const answer = await pc2.createAnswer(); await pc2.setLocalDescription(answer); await pc1.setRemoteDescription(answer);
}
/** Resolves "timeout" when `promise` hasn't settled in `ms` — a frozen mic button in Meet. */
function settles(promise, ms = 1500) {
  const t0 = performance.now();
  return Promise.race([
    promise.then(() => ({ ok: true, ms: Math.round(performance.now() - t0) }), (err) => ({ ok: false, err: String(err), ms: Math.round(performance.now() - t0) })),
    sleep(ms).then(() => ({ ok: false, err: "timeout", ms })),
  ]);
}

function waitMicState(timeoutMs = 2000) {
  return new Promise((resolve) => {
    const t = setTimeout(() => { window.removeEventListener("message", h); resolve(null); }, timeoutMs);
    function h(e) {
      if (e.data && e.data.source === "interpreter-ext" && e.data.type === "interpreter-mic-state") {
        clearTimeout(t); window.removeEventListener("message", h); resolve(e.data);
      }
    }
    window.addEventListener("message", h);
  });
}
function micState() { const p = waitMicState(); post("interpreter-mic-state-request"); return p; }

/** Loudest level (dBFS) of `freq` Hz on `track` over `ms` — the fake mic is a 440 Hz tone, TTS is 660 Hz. */
async function toneLevel(track, freq, ms = 500) {
  return (await toneLevels(track, [freq], ms))[0];
}
/** Same, for several frequencies measured over the same window. */
async function toneLevels(track, freqs, ms = 500) {
  if (!track) return freqs.map(() => -Infinity);
  const actx = new window.__NativeAudioContext(); await actx.resume();
  const src = actx.createMediaStreamSource(new MediaStream([track]));
  const an = actx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0; src.connect(an);
  const bins = new Float32Array(an.frequencyBinCount);
  const idx = freqs.map((f) => Math.round(f / (actx.sampleRate / an.fftSize)));
  const max = freqs.map(() => -Infinity);
  await sleep(200); // the analyser needs full frames of the live signal: a half-filled first frame smears every bin
  const end = performance.now() + ms;
  while (performance.now() < end) {
    an.getFloatFrequencyData(bins);
    idx.forEach((i, k) => { max[k] = Math.max(max[k], bins[i - 1], bins[i], bins[i + 1]); });
    await sleep(40);
  }
  await actx.close();
  return max;
}
const HEARD = -70, SILENT = -85;
// Across the loopback call the codec adds a little noise of its own.
const FAR_HEARD = -45, FAR_SILENT = -70;
const db = (v) => (Number.isFinite(v) ? `${v.toFixed(1)} dB` : String(v));

async function run() {
  document.getElementById("run").disabled = true;
  try {
    const NativeCtx = window.__NativeAudioContext;
    const ctx = new NativeCtx(); await ctx.resume();
    const osc = ctx.createOscillator(); osc.frequency.value = 440; osc.start();
    const real = new Set();
    /** A fresh "microphone" track, like a new getUserMedia call. */
    const newMic = () => { const d = ctx.createMediaStreamDestination(); osc.connect(d); const t = d.stream.getAudioTracks()[0]; real.add(t); return t; };
    const isTranslated = (t) => !!t && !real.has(t) && t.readyState === "live";

    // 0. Before any call, "voice in call" is unknown (never silences the notes)
    const st0 = await micState();
    log("voice-in-call is unknown before any mic sender", st0 && st0.live === null, JSON.stringify(st0));

    // 1. Turned on before joining / before Meet has a mic: armed, engages when the mic appears
    let r = await activate();
    log("activate before any mic is armed (ok)", r && r.ok === true, JSON.stringify(r));
    const pc0 = new RTCPeerConnection();
    const mic0 = newMic();
    const s0 = pc0.addTrack(mic0, new MediaStream([mic0]));
    await sleep(300);
    log("the mic Meet adds later is sent translated", isTranslated(carried(s0)) && s0.track === mic0);
    await deactivate();
    log("deactivate hands that sender its real mic back", carried(s0) === mic0);
    pc0.close();

    // The call: pc1 = us ("Meet"), pc2 = the far end
    const mic = newMic();
    const pc1 = new RTCPeerConnection(), pc2 = new RTCPeerConnection();
    let remote = null;
    pc2.ontrack = (e) => { remote = e.track; const a = new Audio(); a.muted = true; a.srcObject = new MediaStream([e.track]); void a.play().catch(() => {}); };
    const sender = pc1.addTrack(mic, new MediaStream([mic]));
    log("addTrack while inactive sends the real mic", carried(sender) === mic && sender.track === mic);
    await connect(pc1, pc2);
    for (let i = 0; i < 40 && !(remote && pc1.connectionState === "connected"); i++) await sleep(100);
    await sleep(500);
    let far = await toneLevel(remote, 440);
    log("far end hears the real mic while translation is off", far > FAR_HEARD, db(far));

    // 2. Activate → the call carries the translated track; Meet still sees its own track
    r = await activate();
    log("activate reports ok", r && r.ok === true, JSON.stringify(r));
    const repl1 = carried(sender);
    log("sender carries the translated track", isTranslated(repl1), repl1 && repl1.id);
    log("Meet still sees its own mic on sender.track", sender.track === mic);
    log("Meet still finds its sender by track", pc1.getSenders().find((s) => s.track === mic) === sender);
    await sleep(500); // let the far end's jitter buffer drain what was sent before the swap
    far = await toneLevel(remote, 440);
    log("far end no longer hears the real voice", far < FAR_SILENT, db(far));

    // 3. Mic PCM is streamed out (16 kHz Int16 → ~32 kB/s)
    const pcm = await countPcm(1500);
    log("mic PCM flows while active", pcm.n >= 3 && pcm.bytes > 20000 && pcm.loud > 0, JSON.stringify(pcm));

    // 4. Translated speech reaches the far end
    post("interpreter-translated-audio", { data: wav16k(1.2, 660) });
    await sleep(250);
    far = await toneLevel(remote, 660, 600);
    log("far end hears the translation", far > FAR_HEARD, db(far));
    await sleep(500);

    // 5. Meet's mic button, every way it can be wired — it must never freeze
    // 5a. enabled flag through sender.track
    sender.track.enabled = false; await sleep(250);
    log("mute via sender.track.enabled sticks (no hot mic)", mic.enabled === false && carried(sender).enabled === false, `mic=${mic.enabled} carried=${carried(sender).enabled}`);
    const pcmOff = await countPcm(600);
    log("muted by enabled flag: nothing you say is streamed", pcmOff.loud === 0, JSON.stringify(pcmOff));
    sender.track.enabled = true; await sleep(250);
    log("unmute via sender.track.enabled sticks", mic.enabled === true && carried(sender).enabled === true, `mic=${mic.enabled} carried=${carried(sender).enabled}`);
    // 5b. enabled flag through Meet's own reference
    mic.enabled = false; await sleep(250);
    log("mute via the mic track's enabled flag is mirrored", carried(sender).enabled === false);
    mic.enabled = true; await sleep(250);
    log("unmute via the mic track's enabled flag is mirrored", carried(sender).enabled === true);
    // 5c. replaceTrack(null) / replaceTrack(track), awaited, then identity checks
    let t = await settles(sender.replaceTrack(null));
    log("mute via replaceTrack(null) resolves at once", t.ok && t.ms < 500 && carried(sender) === null && sender.track === null, JSON.stringify(t));
    t = await settles(sender.replaceTrack(mic));
    log("unmute via replaceTrack(track) resolves at once", t.ok && t.ms < 500, JSON.stringify(t));
    log("after unmute Meet sees its track, the call gets the translation", sender.track === mic && isTranslated(carried(sender)));
    // 5d. translation turned on while muted by the enabled flag
    await deactivate();
    mic.enabled = false;
    r = await activate();
    log("activate while muted (enabled=false) is ok and stays muted", r && r.ok === true && carried(sender).enabled === false, JSON.stringify(r));
    sender.track.enabled = true; await sleep(250);
    log("unmute after activating muted works", carried(sender).enabled === true && isTranslated(carried(sender)), `carried=${carried(sender).enabled}`);

    // 6. Meet switches microphone while active: instant, still translated
    const mic2 = newMic();
    t = await settles(sender.replaceTrack(mic2));
    log("microphone switch resolves at once", t.ok && t.ms < 500, JSON.stringify(t));
    log("microphone switch keeps the translated track on the call", isTranslated(carried(sender)) && sender.track === mic2);
    const pcm2 = await countPcm(1200);
    log("PCM flows from the new microphone", pcm2.n >= 2 && pcm2.loud > 0, JSON.stringify(pcm2));

    // 7. Mute racing a microphone switch: the mute must win
    const mic3 = newMic();
    const a = sender.replaceTrack(mic3), b = sender.replaceTrack(null);
    await Promise.allSettled([a, b]); await sleep(700);
    log("mute right after a mic switch stays muted", carried(sender) === null, String(carried(sender) && carried(sender).id));
    await sender.replaceTrack(mic2);

    // 8. A second connection added while active gets the translated track immediately
    const pc3 = new RTCPeerConnection(), pc4 = new RTCPeerConnection();
    const tx = pc3.addTransceiver(mic2, { direction: "sendonly" });
    log("addTransceiver(mic) while active sends the translation", isTranslated(carried(tx.sender)) && tx.sender.track === mic2);
    await connect(pc3, pc4);
    pc3.close(); pc4.close(); // closed connections are pruned and don't break swaps

    // 9. Deactivate → every live sender back on the real mic
    await deactivate();
    log("deactivate restores the real mic", carried(sender) === mic2 && sender.track === mic2);
    const pcm3 = await countPcm(800);
    log("PCM stops after deactivate", pcm3.n === 0, JSON.stringify(pcm3));
    far = await toneLevel(remote, 440);
    log("far end hears the real mic again", far > FAR_HEARD, db(far));
    r = await activate();
    log("re-activate ok", r && r.ok === true && isTranslated(carried(sender)), JSON.stringify(r));
    await deactivate();
    log("final deactivate restores mic", carried(sender) === mic2);

    // 10. Mute in Meet (replaceTrack(null)) must survive activate / deactivate
    r = await activate();
    await sender.replaceTrack(null);
    log("mute while active detaches the sender", carried(sender) === null);
    await deactivate();
    log("deactivate keeps a muted sender muted", carried(sender) === null);
    r = await activate();
    log("activate while muted is ok but doesn't unmute", r && r.ok === true && carried(sender) === null, JSON.stringify(r));
    const pcmMuted = await countPcm(900);
    log("muted: stream stays alive but carries only silence", pcmMuted.n >= 2 && pcmMuted.loud === 0, JSON.stringify(pcmMuted));
    t = await settles(sender.replaceTrack(mic2));
    log("unmute while active sends the translated track", t.ok && isTranslated(carried(sender)), JSON.stringify(t));
    await deactivate();
    log("deactivate after unmute restores the real mic", carried(sender) === mic2);

    // 11. Own-voice mix ("Others hear your own voice" while translation is on)
    r = await activate();
    let lvl = await toneLevel(carried(sender), 440);
    log("translation only by default: your real voice is not on the call track", r && r.ok === true && lvl < SILENT, db(lvl));
    post("interpreter-mix", { mic: true }); await sleep(250);
    lvl = await toneLevel(carried(sender), 440);
    log("mix on: your real voice is on the call track", lvl > HEARD, db(lvl));
    far = await toneLevel(remote, 440);
    log("mix on: the far end hears your voice", far > FAR_HEARD, db(far));
    post("interpreter-mix", { mic: false }); await sleep(200);
    lvl = await toneLevel(carried(sender), 440);
    log("mix off: your voice leaves the call track at once", lvl < SILENT, db(lvl));

    // Turning your own voice back on waits for translated speech that is still queued
    // (measured in one window that ends well before the 6 s of queued speech does)
    const queuedAt = performance.now();
    post("interpreter-translated-audio", { data: wav16k(6, 660) });
    await sleep(120);
    post("interpreter-mix", { mic: true });
    const [during, ttsLvl] = await toneLevels(carried(sender), [440, 660], 600);
    const inTime = performance.now() - queuedAt < 5500;
    log("own voice stays off while queued translation plays", inTime && during < SILENT && ttsLvl > HEARD, `voice ${db(during)}, translation ${db(ttsLvl)}, measured within ${Math.round(performance.now() - queuedAt)} ms`);
    while (performance.now() - queuedAt < 6600) await sleep(100);
    lvl = await toneLevel(carried(sender), 440);
    log("own voice comes back once the translation finished", lvl > HEARD, db(lvl));

    // The mix survives Meet switching microphones
    const mic4 = newMic();
    await sender.replaceTrack(mic4);
    lvl = await toneLevel(carried(sender), 440);
    log("own-voice mix survives a microphone switch", isTranslated(carried(sender)) && lvl > HEARD, db(lvl));

    // Mute still wins in own-voice mode
    await sender.replaceTrack(null);
    post("interpreter-mix", { mic: true }); await sleep(200);
    log("muted sender stays muted in own-voice mode", carried(sender) === null);
    await sender.replaceTrack(mic4);
    log("unmute in own-voice mode sends the mixed track", isTranslated(carried(sender)));
    post("interpreter-mix", { mic: false });
    await deactivate();
    log("deactivate after own-voice mode restores the real mic", carried(sender) === mic4);

    // 12. Mute by stopping the mic (track.stop()), unmute with a brand-new track
    r = await activate();
    mic4.stop(); await sleep(200);
    const pcmStopped = await countPcm(500);
    log("stopped mic: nothing loud is streamed", pcmStopped.loud === 0, JSON.stringify(pcmStopped));
    const mic5 = newMic();
    t = await settles(sender.replaceTrack(mic5));
    log("unmute with a fresh track after stop() resolves at once", t.ok && t.ms < 500 && sender.track === mic5 && isTranslated(carried(sender)), JSON.stringify(t));
    const pcm5 = await countPcm(900);
    log("PCM flows from the fresh track", pcm5.loud > 0, JSON.stringify(pcm5));
    post("interpreter-translated-audio", { data: wav16k(3, 660) });
    await sleep(400);
    const [farVoice, farTts] = await toneLevels(remote, [440, 660], 500);
    log("far end hears the translation, not the fresh mic", farTts > FAR_HEARD && farVoice < FAR_SILENT, `translation ${db(farTts)}, voice ${db(farVoice)}`);
    await deactivate();
    // …and translation turned on while the mic is stopped
    mic5.stop(); await sender.replaceTrack(null);
    r = await activate();
    log("activate while the mic is stopped is ok", r && r.ok === true && carried(sender) === null, JSON.stringify(r));
    const mic6 = newMic();
    t = await settles(sender.replaceTrack(mic6));
    log("unmute with a fresh track after activating muted", t.ok && t.ms < 500 && isTranslated(carried(sender)) && sender.track === mic6, JSON.stringify(t));
    await deactivate();
    log("deactivate restores the fresh mic", carried(sender) === mic6);

    // 13. Deactivate when translation never ran must not touch the call
    const other = newMic();
    const pc5 = new RTCPeerConnection();
    const s5 = pc5.addTrack(other, new MediaStream([other]));
    await deactivate();
    log("deactivate while idle leaves every sender alone", carried(s5) === other && carried(sender) === mic6);
    pc5.close();

    // 14. "Is your voice reaching the call?" reporting (drives the notes mic)
    let st = await micState(true);
    log("voice reported live while unmuted in the call", st && st.live === true, JSON.stringify(st));
    let next = waitMicState(); mic6.enabled = false; st = await next;
    log("disabling the mic track reports not live", st && st.live === false, JSON.stringify(st));
    next = waitMicState(); mic6.enabled = true; st = await next;
    log("re-enabling reports live again", st && st.live === true, JSON.stringify(st));
    next = waitMicState(); await sender.replaceTrack(null); st = await next;
    log("Meet detaching the sender (mute) reports not live", st && st.live === false, JSON.stringify(st));
    next = waitMicState(); await sender.replaceTrack(mic6); st = await next;
    log("unmute reports live", st && st.live === true, JSON.stringify(st));
    const btn = document.createElement("button"); btn.setAttribute("aria-label", "Turn on microphone (ctrl + d)"); btn.setAttribute("data-is-muted", "true"); document.body.appendChild(btn);
    next = waitMicState(); st = await next;
    log("Meet's mute button wins over track state", st && st.live === false, JSON.stringify(st));
    btn.remove();
    next = waitMicState(); st = await next;
    log("removing the muted button reports live", st && st.live === true, JSON.stringify(st));

    // 15. Fail open: when our audio pipeline can't be built the call keeps the real mic
    // 15a. the worklet module fails to load
    AudioWorklet.prototype.addModule = () => Promise.reject(new Error("harness: blocked"));
    r = await activate(8000);
    log("pipeline build failure is reported", r && r.ok === false && !!r.message, JSON.stringify(r));
    log("pipeline build failure leaves the real mic on the call", carried(sender) === mic6);
    far = await toneLevel(remote, 440);
    log("far end still hears the real mic after the failure", far > FAR_HEARD, db(far));
    await deactivate();
    AudioWorklet.prototype.addModule = window.__nativeAddModule;

    // 15b. the AudioContext never starts (would be a silent call)
    window.AudioContext = class extends NativeCtx {
      constructor(o) { super(o); void NativeCtx.prototype.suspend.call(this); }
      resume() { return Promise.resolve(); }
    };
    r = await activate(8000);
    log("a context that won't run is reported, not sent to the call", r && r.ok === false && carried(sender) === mic6, JSON.stringify(r));
    await deactivate();
    window.AudioContext = NativeCtx;

    // 15c. the build hangs forever: Meet's own mic calls must not wait for it
    AudioWorklet.prototype.addModule = () => new Promise(() => {});
    const hung = nextActivation(9000); post("interpreter-activate");
    await sleep(300);
    t = await settles(sender.replaceTrack(null));
    log("mute resolves while the build hangs", t.ok && t.ms < 500 && carried(sender) === null, JSON.stringify(t));
    const mic7 = newMic();
    t = await settles(sender.replaceTrack(mic7));
    log("unmute resolves while the build hangs, with the real mic", t.ok && t.ms < 500 && carried(sender) === mic7, JSON.stringify(t));
    r = await hung;
    log("a hanging build times out and is reported", r && r.ok === false, JSON.stringify(r));
    log("after the timeout the call still has the real mic", carried(sender) === mic7);
    await deactivate();
    AudioWorklet.prototype.addModule = window.__nativeAddModule;

    // 15d. …and everything works again afterwards
    r = await activate();
    log("activation works again after the failures", r && r.ok === true && isTranslated(carried(sender)) && sender.track === mic7, JSON.stringify(r));
    await deactivate();
    log("deactivate restores the mic", carried(sender) === mic7);

    // 16. Leaving the call
    next = waitMicState(); pc1.close(); st = await next;
    log("leaving the call reports not live", st && st.live === false, JSON.stringify(st));
  } catch (err) {
    log("harness exception", false, String(err && err.stack || err));
  }
  window.__results = results;
  out.textContent += `\nDONE ${results.filter((x) => x.pass).length}/${results.length}\n`;
}
document.getElementById("run").addEventListener("click", () => void run());
</script>
</body>
</html>
